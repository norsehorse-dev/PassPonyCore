name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Kept in sync with PassPonyAndroid's gradle.properties `ndkVersion` --
  # see that repo's docs/REPRODUCIBLE.md. Only used by the android-check
  # job below; nothing here needs it for the plain cargo build/test.
  ANDROID_NDK_VERSION: "27.2.12479018"

jobs:
  test:
    name: Build, fixtures, parity + round-trip + git matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install reference CLIs
        run: sudo apt-get update && sudo apt-get install -y pass pass-extension-otp oathtool age tree expect

      - name: Rust toolchain (pinned by rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Regenerate fixture corpus from the real CLIs
        run: bash fixtures/gen-fixtures.sh

      - name: Corpus drift check
        # Keys are committed, so regeneration must not change goldens.
        # Ciphertexts legitimately differ (age/gpg are randomized); goldens
        # (plaintext outputs, exit codes, listings) must not.
        run: |
          git diff --exit-code -- ':(glob)fixtures/**/goldens/**' 'fixtures/keys' || {
            echo '::error::fixture goldens drifted from committed corpus'; exit 1; }

      - name: Build
        run: cargo build --locked --all-targets

      - name: Test
        run: cargo test --locked

      - name: Build pass-ffi with the age-engine feature
        # age-engine is optional and off by default (iOS doesn't use it --
        # see crates/pass-ffi/Cargo.toml) so the default `cargo build`
        # above never exercises it. PassPonyAndroid's build always enables
        # it, so it needs its own coverage here rather than relying on
        # PassPonyAndroid's CI to be the first place a break surfaces.
        run: cargo build --locked -p pass-ffi --features age-engine --all-targets

      - name: Test pass-ffi with the age-engine feature
        run: cargo test --locked -p pass-ffi --features age-engine

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Clippy (age-engine feature)
        run: cargo clippy --locked -p pass-ffi --features age-engine --all-targets -- -D warnings

      # pgp-engine (rpgp for pass stores) is iOS-only, off by default like
      # age-engine, so it needs its own coverage. Its tests decrypt real
      # GnuPG output from fixtures/pgp-engine (RSA, locked RSA, subkeys-only
      # export, AEAD/OCB) and round-trip encrypt.
      - name: Test pass-ffi with the pgp-engine feature
        run: cargo test --locked -p pass-ffi --features pgp-engine

      - name: Clippy (pgp-engine feature)
        run: cargo clippy --locked -p pass-ffi --features pgp-engine --all-targets -- -D warnings

      - name: Format
        run: cargo fmt --check

  android-check:
    name: Android cross-compile check (pass-ffi, age-engine)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install perl and make
        # Required by pass-core's vendored OpenSSL build for mobile
        # targets (see PassPonyAndroid's scripts/build-core.sh, which
        # documents the same requirement for its own cross-compile).
        run: sudo apt-get update && sudo apt-get install -y perl make

      - name: Add Android Rust targets
        run: rustup target add aarch64-linux-android x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - uses: android-actions/setup-android@v4

      - name: Install pinned NDK
        run: sdkmanager --install "ndk;${{ env.ANDROID_NDK_VERSION }}"

      - name: Cross-compile check pass-ffi for Android (age-engine)
        # A real cross-compile rather than a plain `cargo check`: pass-core's
        # vendored OpenSSL build script runs regardless of check vs. build,
        # so there's no cheaper way to catch an Android-specific break here.
        # This mirrors what PassPonyAndroid's own scripts/build-core.sh does,
        # just for one ABI, so a break surfaces in this repo's own CI first.
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/${{ env.ANDROID_NDK_VERSION }}
        run: cargo ndk --platform 26 -t arm64-v8a build -p pass-ffi --features age-engine

  git-server-matrix:
    name: Git matrix vs ${{ matrix.server.name }}
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        server:
          # The SSH leg is its own job (ssh-bare below): it needs a key,
          # a pinned host and the refusal cases, not just a URL.
          - name: forgejo
            setup: |
              docker run -d --name forgejo -p 3000:3000 -p 2223:22 \
                -e FORGEJO__security__INSTALL_LOCK=true \
                codeberg.org/forgejo/forgejo:9
              sleep 15
              docker exec -u git forgejo forgejo admin user create \
                --username ci --password ci-password-1 --email ci@passpony.test --admin
              curl -sf -X POST -u ci:ci-password-1 \
                -H 'Content-Type: application/json' \
                -d '{"name":"store","auto_init":false,"default_branch":"main"}' \
                http://localhost:3000/api/v1/user/repos
            url: http://ci:ci-password-1@localhost:3000/ci/store.git
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install age
        run: sudo apt-get update && sudo apt-get install -y age
      - name: Start server
        run: ${{ matrix.server.setup }}
      - name: Run remote matrix
        env:
          PASSPONY_REMOTE_URL: ${{ matrix.server.url }}
          # Remote-matrix tests are gated behind this env var; without it the
          # git tests run against local bare repos only.
        run: cargo test --locked -p pass-devtools --test git_matrix

  ssh-bare:
    name: SSH remote vs OpenSSH + bare repo (${{ matrix.key.name }})
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        key:
          # A key generated the way the apps import one, with a passphrase,
          # plus the committed RSA and ECDSA fixtures.
          - name: ed25519-protected
            setup: ssh-keygen -q -t ed25519 -N "ci pass" -C ci-client -f "$RUNNER_TEMP/client"
            passphrase: ci pass
          - name: rsa-protected
            setup: cp fixtures/ssh/rsa-protected fixtures/ssh/rsa-protected.pub "$RUNNER_TEMP/" && mv "$RUNNER_TEMP/rsa-protected" "$RUNNER_TEMP/client" && mv "$RUNNER_TEMP/rsa-protected.pub" "$RUNNER_TEMP/client.pub"
            passphrase: pony ssh test
          - name: ecdsa
            setup: cp fixtures/ssh/ecdsa-plain "$RUNNER_TEMP/client" && cp fixtures/ssh/ecdsa-plain.pub "$RUNNER_TEMP/client.pub"
            passphrase: ""
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Client key
        run: ${{ matrix.key.setup }}
      - name: OpenSSH server with an empty bare repo
        run: |
          sudo apt-get update && sudo apt-get install -y openssh-server
          sudo useradd -m -s /bin/bash gitci
          sudo usermod -p '*' gitci
          sudo install -d -m 700 -o gitci -g gitci /home/gitci/.ssh
          sudo install -m 600 -o gitci -g gitci "$RUNNER_TEMP/client.pub" /home/gitci/.ssh/authorized_keys
          sudo -u gitci git init -q --bare -b main /home/gitci/store.git
          ssh-keygen -q -t ed25519 -N "" -f "$RUNNER_TEMP/host_ed25519"
          cat > "$RUNNER_TEMP/sshd_config" <<EOF
          Port 2222
          ListenAddress 127.0.0.1
          HostKey $RUNNER_TEMP/host_ed25519
          PidFile $RUNNER_TEMP/sshd.pid
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          PubkeyAuthentication yes
          UsePAM no
          StrictModes no
          EOF
          sudo mkdir -p /run/sshd
          sudo /usr/sbin/sshd -f "$RUNNER_TEMP/sshd_config" -E "$RUNNER_TEMP/sshd.log"
      - name: Clone, push, pull, and every refusal over SSH
        env:
          PASSPONY_SSH_URL: ssh://gitci@127.0.0.1:2222/home/gitci/store.git
          PASSPONY_SSH_KEY: ${{ runner.temp }}/client
          PASSPONY_SSH_HOST_KEY: ${{ runner.temp }}/host_ed25519.pub
        run: |
          if [ -n "${{ matrix.key.passphrase }}" ]; then export PASSPONY_SSH_KEY_PASSPHRASE="${{ matrix.key.passphrase }}"; fi
          cargo test --locked -p pass-devtools --test ssh_remote -- --nocapture
      - name: sshd log
        if: failure()
        run: cat "$RUNNER_TEMP/sshd.log"
