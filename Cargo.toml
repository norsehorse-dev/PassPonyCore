[workspace]
members = ["crates/pass-core", "crates/pass-ffi"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/norsehorse-dev/passponycore"

[workspace.dependencies]
thiserror = "2"
uniffi = "0.32"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
