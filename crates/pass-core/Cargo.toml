[package]
name = "pass-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Store model, entry codec, and sync engine for pass/passage stores. Crypto-free by design."

[dependencies]
thiserror.workspace = true
zeroize = { version = "1", features = ["derive"] }
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
git2 = "0.20"

# Mobile targets have no system OpenSSL to link against; build it from source
# there. Desktop/CI keep linking the system library.
[target.'cfg(any(target_os = "ios", target_os = "android"))'.dependencies]
openssl-sys = { version = "0.9", features = ["vendored"] }
