[package]
name = "pass-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "UniFFI bindings over pass-core for Kotlin and Swift."

[lib]
name = "pass_ffi"
crate-type = ["lib", "staticlib", "cdylib"]

[dependencies]
pass-core = { path = "../pass-core" }
thiserror.workspace = true
uniffi.workspace = true
zeroize = "1"

# Android-only Rust crypto engine for passage stores (see age_engine.rs).
# iOS keeps its own platform engine; this dependency and the module it
# feeds are both gated behind the age-engine feature, off by default so
# the iOS build surface is provably unchanged.
#
# The `armor` feature is only for reading ASCII-armored passphrase-protected
# identities files (see age_decrypt_identities_file); stores themselves are
# binary age files.
age = { version = "0.11", default-features = false, features = ["armor"], optional = true }

# iOS-only Rust OpenPGP engine for pass stores (see pgp_engine.rs): the
# keys and messages NorseHorsePGPCore can't handle (RSA, NIST curves,
# GnuPG's AEAD packets). Android has BouncyCastle and leaves this off, so
# its build surface and reproducible .so are unchanged.
pgp = { version = "=0.20.0", optional = true }
rand = { version = "0.8", optional = true }
rsa = { version = "0.9", optional = true }

[features]
cli = ["uniffi/cli"]
age-engine = ["dep:age"]
pgp-engine = ["dep:pgp", "dep:rand", "dep:rsa"]

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
required-features = ["cli"]
